# Exemplo para túnel localmente gerenciado (alternativa ao token do dashboard).
# Copie para: %USERPROFILE%\.cloudflared\config.yml
#
# 1) cloudflared tunnel login
# 2) cloudflared tunnel create sefaz-proxy-vectra
# 3) cloudflared tunnel route dns sefaz-proxy-vectra sefaz-proxy.vectracargo.com.br
# 4) Substitua <TUNNEL_UUID> e o credentials-file abaixo

tunnel: <TUNNEL_UUID>
credentials-file: C:\Users\marce\.cloudflared\<TUNNEL_UUID>.json

ingress:
  - hostname: sefaz-proxy.vectracargo.com.br
    service: http://127.0.0.1:3333
  - service: http_status:404
